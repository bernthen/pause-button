<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pause Button</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* One screen, one object: the photographed panel fills the window and the button is the only thing to touch. */
  :root {
    --panel: #e7e0d9;      /* the photo's border colour, exact */
    --ink: #8a8279;        /* warm grey, printed-legend feel */
    --ink-strong: #5d5750;
    --focus: #1e14c8;      /* the PAUSE blue */
    --font-ui: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: var(--panel);
    color: var(--ink);
    font-family: var(--font-ui);
    margin: 0;
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
  }
  /* The photo's border is a flat panel colour, so the page continues it seamlessly.
     The stage is pinned so the button's centre (49.94% / 51.73% of the photo) sits at the centre of the screen. */
  .stage {
    position: fixed;
    left: 50%; top: 50%;
    height: min(675px, 82vh, calc((100vw - 32px) * 1.25));
    aspect-ratio: 4 / 5;
    transform: translate(-49.94%, -51.73%);
  }
  canvas { display: block; width: 100%; height: 100%; }
  .cap {
    position: absolute;
    left: 49.94%; top: 51.73%;
    width: 11.4%; aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border: 0; padding: 0; margin: 0;
    background: transparent;
    border-radius: 50%;
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  .cap:focus { outline: none; }
  .cap:focus-visible { outline: 2px solid var(--focus); outline-offset: 6px; }
</style>

<div class="stage" id="stage">
  <canvas id="c" width="1080" height="1350" aria-hidden="true"></canvas>
  <button class="cap" id="cap" type="button" aria-label="Pause"></button>
</div>

  const cv = document.getElementById('c'), g = cv.getContext('2d');
  const cap = document.getElementById('cap'), stage = document.getElementById('stage');
  const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });

  // click sounds: decoded up-front so the first press is never silent
  let ac = null; const buf = {};
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    for (const k in SND) {
      const b = Uint8Array.from(atob(SND[k]), c => c.charCodeAt(0)).buffer;

  function release() { if (!held) return; held = false; wake(); }

  cap.addEventListener('pointerdown', e => { e.preventDefault(); cap.setPointerCapture(e.pointerId); press(); });
  cap.addEventListener('pointerup', release);
  cap.addEventListener('pointercancel', release);
  cap.addEventListener('lostpointercapture', release);
  cap.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); press(); } });
  cap.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') release(); });
  cap.addEventListener('blur', release);
  cap.addEventListener('contextmenu', e => e.preventDefault());

  Promise.all([load(BASE), load(FRAMES)]).then(([b, f]) => { base = b; frames = f; draw(); });
